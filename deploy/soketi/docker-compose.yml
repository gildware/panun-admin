version: '3.8'

services:
  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    container_name: panun-soketi
    restart: unless-stopped
    ports:
      - "${SOKETI_PORT:-6001}:6001"
    environment:
      SOKETI_DEBUG: "${SOKETI_DEBUG:-0}"
      SOKETI_DEFAULT_APP_ID: "${PUSHER_APP_ID:-panun-app}"
      SOKETI_DEFAULT_APP_KEY: "${PUSHER_APP_KEY:-panun-key}"
      SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET:-panun-secret}"
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "false"
      SOKETI_DEFAULT_APP_ENABLED: "true"
      SOKETI_DEFAULT_APP_MAX_CONNECTIONS: "10000"
      SOKETI_DEFAULT_APP_MAX_BACKEND_EVENTS_PER_SEC: "1000"
