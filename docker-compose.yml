services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    environment:
      # Force Docker service hosts even if Hostinger values were pasted
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
      - oauth_keys:/var/www/html/storage/oauth-keys
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Route both production host and VPS test host
      - traefik.http.routers.panun-live-http.rule=Host(`live.panunkaergar.com`) || Host(`live-vps.panunkaergar.com`)
      - traefik.http.routers.panun-live-http.entrypoints=web
      - traefik.http.routers.panun-live-http.service=panun-live
      - traefik.http.routers.panun-live.rule=Host(`live.panunkaergar.com`) || Host(`live-vps.panunkaergar.com`)
      - traefik.http.routers.panun-live.entrypoints=websecure
      - traefik.http.routers.panun-live.tls=true
      - traefik.http.routers.panun-live.tls.certResolver=letsencrypt
      - traefik.http.routers.panun-live.service=panun-live
      - traefik.http.services.panun-live.loadbalancer.server.port=80
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2048M

  worker:
    build: .
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
      - oauth_keys:/var/www/html/storage/oauth-keys
    entrypoint: ["/entrypoint.sh"]
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 512M

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-panun}
      MYSQL_USER: ${DB_USERNAME:-panun}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=1G
      --max-connections=150
      --skip-log-bin
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: "0.80"
          memory: 2560M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 384mb --maxmemory-policy allkeys-lru
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 512M

volumes:
  mysql_data:
  app_storage:
  app_logs:
  oauth_keys:

networks:
  dokploy-network:
    external: true
