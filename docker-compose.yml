services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    environment:
      # Force Docker service hosts even if Hostinger values were pasted
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    # No host ports — Dokploy Traefik will attach the domain to service "app" on port 80
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768M

  worker:
    build: .
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    entrypoint: ["/entrypoint.sh"]
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 384M

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-panun}
      MYSQL_USER: ${DB_USERNAME:-panun}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --max-connections=50
      --skip-log-bin
    # Soft check only — do not block app startup on "unhealthy"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 1024M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 192M

volumes:
  mysql_data:
  app_storage:
  app_logs:
